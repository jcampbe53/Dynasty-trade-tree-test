<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trade Tree">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dynasty Trade Tree</title>
<style>
:root{
 --red:#d71920;--black:#111;--charcoal:#1d1d1f;--bg:#f3f3f3;--card:#fff;
 --text:#141414;--muted:#6c6c70;--line:#dedede;--green:#168343;--softred:#fff0f1;
 --pick:#fff6e8;--player:#f7f7f7;--navh:68px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}
button,input,select{font:inherit}
button{touch-action:manipulation}
.topbar{position:sticky;top:0;z-index:40;background:var(--black);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-top:4px solid var(--red)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:18px;font-weight:900;letter-spacing:.3px;text-transform:uppercase}
.brand span{color:var(--red)}
.subbrand{font-size:11px;color:#bdbdbd;margin-top:2px}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;font-size:20px}
main{max-width:900px;margin:auto;padding:12px}
.view{display:none}.view.active{display:block}
.sectionTitle{font-size:13px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;margin:18px 2px 8px;border-left:4px solid var(--red);padding-left:8px}
.hero{background:var(--card);border-top:4px solid var(--red);padding:14px;margin-bottom:10px}
.heroLabel{font-size:11px;font-weight:900;color:var(--red);letter-spacing:.7px;text-transform:uppercase}
.heroTeams{font-size:21px;font-weight:900;margin:6px 0}
.heroDate{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);padding:11px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.tradeHead{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.tradeTeams{font-weight:900;font-size:15px}.tradeDate{font-size:11px;color:var(--muted);white-space:nowrap}
.tradeSides{display:grid;grid-template-columns:1fr 1fr}
.tradeSide{padding:10px 12px;min-width:0}.tradeSide+ .tradeSide{border-left:1px solid var(--line)}
.sideName{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.asset{display:block;width:100%;border:0;background:transparent;text-align:left;padding:5px 0;color:var(--text);font-size:13px}
.asset.link{color:var(--red);font-weight:700}.asset.link:after{content:"  ›"}
.cardAction{width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:10px 12px;text-align:right;color:var(--red);font-size:12px;font-weight:900;text-transform:uppercase}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
select,input{width:100%;height:44px;border:1px solid #cfcfcf;background:#fff;border-radius:0;padding:0 10px;font-size:16px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#111;color:#aaa;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #333}
.navbtn{border:0;background:transparent;color:inherit;min-height:var(--navh);font-size:10px;font-weight:800;text-transform:uppercase}
.navbtn .ico{display:block;font-size:21px;margin-bottom:3px}.navbtn.active{color:#fff}
.detailTop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:0;background:#111;color:#fff;padding:9px 12px;font-weight:800}
.detailTitle{font-weight:900;font-size:17px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line);margin-bottom:10px}
.tab{border:0;background:#fff;padding:12px;font-weight:900;font-size:12px;text-transform:uppercase;border-bottom:3px solid transparent}
.tab.active{color:var(--red);border-color:var(--red)}
.originalBadge{display:inline-block;background:var(--black);color:#fff;font-size:10px;font-weight:900;padding:4px 7px;text-transform:uppercase;margin-bottom:8px}
.treeRoot{background:#fff;border:1px solid var(--line);margin-bottom:8px}
.treeRootHead{display:flex;justify-content:space-between;gap:8px;padding:11px}
.treeOpen{border:0;background:var(--red);color:#fff;padding:8px 10px;font-weight:800}
.treeBody{padding:0 8px 10px}.branch{border-left:2px solid #d5d5d5;margin:7px 0 7px 7px;padding-left:9px}
.node{background:#fff;border:1px solid var(--line);padding:9px;font-size:13px}
.node.trade{border-left:4px solid var(--red);background:#fff9f9}.node.draft{border-left:4px solid #bb7a00;background:var(--pick)}.node.current{background:#f2f6ff}
.muted{color:var(--muted);font-size:12px}.tiny{color:var(--muted);font-size:11px}
.bundle{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.4}
.teamGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teamCard{background:#fff;border:1px solid var(--line);padding:12px;text-align:left}
.teamCard b{display:block;font-size:15px}.teamCard span{font-size:12px;color:var(--muted)}
.positionGroup{background:#fff;border:1px solid var(--line);margin-bottom:8px}
.positionTitle{font-size:11px;font-weight:900;background:#f3f3f3;padding:7px 10px;text-transform:uppercase}
.playerRow{padding:8px 10px;border-top:1px solid #eee}
.modal{position:fixed;inset:0;z-index:100;background:#fff;display:none;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
.modal.open{display:block}
.modalHead{position:sticky;top:0;background:#111;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;justify-content:space-between;z-index:3;border-top:4px solid var(--red)}
.modalTitle{font-weight:900;text-transform:uppercase}.close{border:0;background:#2a2a2a;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px}
.modalBody{padding:12px;max-width:800px;margin:auto}
.journey{border-left:3px solid #d8d8d8;margin-left:10px;padding-left:14px}
.stop{position:relative;background:#fff;border:1px solid var(--line);padding:10px;margin-bottom:12px}
.stop:before{content:"";position:absolute;left:-21px;top:17px;width:11px;height:11px;background:var(--red);border-radius:50%}
.stop strong{display:block}
.searchInput{margin-bottom:10px}
.searchGroup{margin-bottom:14px}
.searchResult{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px;text-align:left}
.searchResult b{display:block}.searchResult span{font-size:12px;color:var(--muted)}
.update{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom));z-index:80;background:#111;color:#fff;padding:11px;border-left:5px solid var(--red);align-items:center;justify-content:space-between;gap:10px}
.update.show{display:flex}.update button{border:0;background:var(--red);color:#fff;padding:8px 10px;font-weight:900}
.version{text-align:center;color:#999;font-size:10px;padding:18px 0 4px}
.empty{background:#fff;border:1px dashed #ccc;padding:20px;text-align:center;color:var(--muted)}
@media(min-width:700px){.tradeSides{grid-template-columns:1fr 1fr}.teamGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="topbar">
 <div class="toprow">
  <div><div class="brand">Dynasty <span>Trade Tree</span></div><div class="subbrand" id="leagueSubtitle"></div></div>

 </div>
</header>
<main>

 <section id="trades" class="view"></section>
 <section id="trees" class="view"></section>
 <section id="teams" class="view"></section>
 <section id="detail" class="view"></section>
</main>

<nav class="bottomnav" id="bottomNav">
 <button class="navbtn active" data-view="home"><span class="ico">⌂</span>Home</button>
 <button class="navbtn" data-view="trades"><span class="ico">⇄</span>Trades</button>
 <button class="navbtn" data-view="trees"><span class="ico">⑂</span>Trees</button>
 <button class="navbtn" data-view="teams"><span class="ico">🏈</span>Teams</button>
</nav>

<div class="modal" id="modal">
 <div class="modalHead"><div class="modalTitle" id="modalTitle"></div><button class="close" id="modalClose">×</button></div>
 <div class="modalBody" id="modalBody"></div>
</div>
<div class="update" id="updateBanner"><span>A new app version is available.</span><button id="reloadBtn">Refresh</button></div>

const VERSION=APP.version;
const RED="#d71920";
const CM=APP.currentMap, TR=APP.trades, PJ=APP.pickJourneys, PLAYJ=APP.playerJourneys, TEAMS=APP.teams;
const TREE=APP.tree, S=TREE.spells, TS=TREE.tradeSides, DE=Object.assign({},TREE.startupEvents,TREE.draftEvents);

function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function date(ms){return new Date(Number(ms)).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})}
function rosterName(r){const x=CM[String(r)]||{};return x.display_name||("Roster "+r)}
function teamName(r){const x=CM[String(r)]||{};return (x.team_name||"").trim()}
function fullTeam(r){const t=teamName(r);return rosterName(r)+(t?" · "+t:"")}
function assetLabel(sid){const s=S[sid];return s?(s.label||s.asset_id||sid):sid}
function sideAssets(t,r,kind){return ((t.side[String(r)]||{})[kind]||[])}
function assetButton(a){
 if(a.type==="pick") return `<button class="asset link" data-pick="${esc(a.key)}">${esc(a.label)}</button>`;
 if(a.type==="player") return `<button class="asset link" data-player="${esc(a.id)}">${esc(a.label)}</button>`;
 return `<div class="asset">${esc(a.label)}</div>`;
}
function bindAssetLinks(root=document){
 root.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openPick(b.dataset.pick)}));
 root.querySelectorAll("[data-player]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openPlayer(b.dataset.player)}));
 root.querySelectorAll("[data-trade]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();closeModal();openTrade(b.dataset.trade)}));
 root.querySelectorAll("[data-team]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openTeam(b.dataset.team)}));
}
function tradeCard(t,compact=false){
 const [a,b]=t.rosters;
 const recA=sideAssets(t,a,"received"), recB=sideAssets(t,b,"received");
 return `<article class="card">
  <div class="tradeHead"><div class="tradeTeams">${esc(rosterName(a))} ⇄ ${esc(rosterName(b))}</div><div class="tradeDate">${date(t.time)}</div></div>
  <div class="tradeSides">
   <div class="tradeSide"><div class="sideName">${esc(rosterName(a))} received</div>${recA.map(assetButton).join("")||'<div class="muted">No assets</div>'}</div>
   <div class="tradeSide"><div class="sideName">${esc(rosterName(b))} received</div>${recB.map(assetButton).join("")||'<div class="muted">No assets</div>'}</div>
  </div>
  <button class="cardAction" data-trade="${esc(t.id)}">View trade ›</button>
 </article>`;
}
function showView(name){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
 document.getElementById(name).classList.add("active");
 document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===name));
 document.getElementById("bottomNav").style.display=name==="detail"?"none":"grid";
 window.scrollTo(0,0);
}

function renderHome(){
 const latest=TR[0];
 const uniquePlayerMoves=new Set(), pickMoves=[];
 TR.forEach(t=>Object.values(t.side).forEach(s=>(s.received||[]).forEach(a=>{if(a.type==="player")uniquePlayerMoves.add(t.id+"|"+a.id);if(a.type==="pick")pickMoves.push(t.id+"|"+a.key)})));
 document.getElementById("home").innerHTML=`
  <div class="hero"><div class="heroLabel">Latest Trade</div><div class="heroTeams">${esc(rosterName(latest.rosters[0]))} ⇄ ${esc(rosterName(latest.rosters[1]))}</div><div class="heroDate">${date(latest.time)}</div><button class="cardAction" data-trade="${latest.id}">View latest trade ›</button></div>
  <div class="stats"><div class="stat"><b>${TR.length}</b><span>Trades</span></div><div class="stat"><b>${uniquePlayerMoves.size}</b><span>Player Moves</span></div><div class="stat"><b>${pickMoves.length}</b><span>Pick Moves</span></div></div>
  <div class="sectionTitle">Recent Trades</div>${TR.slice(0,5).map(t=>tradeCard(t,true)).join("")}
  <div class="sectionTitle">Explore</div>
  <div class="card"><button class="cardAction" id="exploreTrees">Open Trade Trees ›</button></div>
  <div class="version">Dynasty Trade Tree v${VERSION}</div>`;
 bindAssetLinks(document.getElementById("home"));
 document.getElementById("exploreTrees").onclick=()=>{renderTrees();showView("trees")};
}

function renderTrades(){
 document.getElementById("trades").innerHTML=`
  <div class="sectionTitle">Trade Log</div>
  <div class="filters"><select id="tradeSeason"><option value="all">All seasons</option>${[...new Set(TR.map(t=>t.season))].sort().map(s=>`<option>${s}</option>`).join("")}</select>
  <select id="tradeTeam"><option value="all">All teams</option>${Object.keys(TEAMS).map(r=>`<option value="${r}">${esc(rosterName(r))}</option>`).join("")}</select></div>
  <div id="tradeCards"></div>`;
 const draw=()=>{
  let arr=TR.slice(), s=document.getElementById("tradeSeason").value, r=document.getElementById("tradeTeam").value;
  if(s!=="all")arr=arr.filter(t=>t.season===s);if(r!=="all")arr=arr.filter(t=>t.rosters.map(String).includes(r));
  document.getElementById("tradeCards").innerHTML=arr.map(t=>tradeCard(t)).join("")||'<div class="empty">No trades found.</div>';
  bindAssetLinks(document.getElementById("tradeCards"));
 };
 document.getElementById("tradeSeason").onchange=draw;document.getElementById("tradeTeam").onchange=draw;draw();
}

const spellToTrade={};Object.values(TS).forEach(e=>(e.inputs||[]).forEach(sid=>spellToTrade[sid]=e.event_id));
const spellToDraft={};Object.values(DE).forEach(e=>{if(e.pick_spell)spellToDraft[e.pick_spell]=e.event_id});
const roots=Object.values(S).filter(s=>s.source_type==="startup_pick_origin"||s.source_type==="pick_origin"||(s.kind==="player"&&(s.source_type==="waiver"||s.source_type==="free_agent")));
const leadMemo={};
function leadsToTrade(sid,seen=new Set()){if(leadMemo[sid]!==undefined)return leadMemo[sid];if(seen.has(sid))return false;seen.add(sid);if(spellToTrade[sid])return leadMemo[sid]=true;const did=spellToDraft[sid];if(did)return leadMemo[sid]=leadsToTrade(DE[did].player_spell,seen);return leadMemo[sid]=false}
function renderSpell(sid,depth=0,seen=new Set()){
 if(depth>25||seen.has(sid))return '<div class="tiny">Branch already shown.</div>';
 const nseen=new Set(seen);nseen.add(sid);const s=S[sid];if(!s)return "";
 let out=`<div class="branch"><div class="node${!s.end_time?" current":""}"><b>${esc(assetLabel(sid))}</b><div class="tiny">${esc(fullTeam(s.owner_roster))}${s.end_time?" · held until "+date(s.end_time):" · CURRENT"}</div></div>`;
 const did=spellToDraft[sid];
 if(did){const e=DE[did];out+=`<div class="branch"><div class="node draft"><b>${did.startsWith("STARTUP:")?"Startup Draft":"Rookie Draft"}</b><div class="tiny">${esc(e.season)} · ${e.round}.${String(e.draft_slot).padStart(2,"0")} → ${esc(e.player_name)}</div></div>${renderSpell(e.player_spell,depth+1,nseen)}</div>`}
 else{const tid=spellToTrade[sid];if(tid){const e=TS[tid];out+=`<div class="branch"><div class="node trade"><b>Trade · ${date(e.time)}</b><div class="bundle"><b>Gave:</b> ${esc((e.inputs||[]).map(assetLabel).join("; ")||"—")}<br><b>Got:</b> ${esc((e.outputs||[]).map(assetLabel).join("; ")||"—")}</div></div>`;(e.outputs||[]).forEach(o=>out+=renderSpell(o,depth+1,nseen));out+='</div>'}}
 return out+'</div>';
}
function renderTrees(){
 document.getElementById("trees").innerHTML=`
  <div class="sectionTitle">Trade Trees</div><div class="filters"><select id="treeTeam"><option value="all">All teams</option>${Object.keys(TEAMS).map(r=>`<option value="${r}">${esc(rosterName(r))}</option>`).join("")}</select><input id="treeSearch" type="search" placeholder="Search root asset"></div><div id="treeList"></div>`;
 const draw=()=>{
  let arr=roots.filter(s=>leadsToTrade(s.spell_id));const r=document.getElementById("treeTeam").value,q=document.getElementById("treeSearch").value.toLowerCase().trim();
  if(r!=="all")arr=arr.filter(s=>String(s.owner_roster)===r);if(q)arr=arr.filter(s=>String(s.label||s.asset_id).toLowerCase().includes(q));
  arr.sort((a,b)=>a.owner_roster-b.owner_roster||a.start_time-b.start_time);
  document.getElementById("treeList").innerHTML=arr.map(s=>`<div class="treeRoot"><div class="treeRootHead"><div><b>${esc(s.label||s.asset_id)}</b><div class="tiny">${esc(fullTeam(s.owner_roster))}</div></div><button class="treeOpen" data-root="${s.spell_id}">Open</button></div><div class="treeBody" id="tree_${s.spell_id}" hidden></div></div>`).join("")||'<div class="empty">No matching trees.</div>';
  document.querySelectorAll("[data-root]").forEach(b=>b.onclick=()=>{const el=document.getElementById("tree_"+b.dataset.root);if(el.hidden){el.innerHTML=renderSpell(b.dataset.root);el.hidden=false;b.textContent="Close"}else{el.hidden=true;b.textContent="Open"}});
 };
 document.getElementById("treeTeam").onchange=draw;document.getElementById("treeSearch").oninput=draw;draw();
}

function renderTeams(){
 document.getElementById("teams").innerHTML=`<div class="sectionTitle">Franchises</div><div class="teamGrid">${Object.values(TEAMS).map(t=>`<button class="teamCard" data-team="${t.rosterId}"><b>${esc(t.manager)}</b><span>${esc(t.teamName||"Roster "+t.rosterId)}</span></button>`).join("")}</div>`;
 bindAssetLinks(document.getElementById("teams"));
}
function openTeam(r){
 const t=TEAMS[String(r)];if(!t)return;
 const groups={};t.players.forEach(p=>(groups[p.position||"Other"]||(groups[p.position||"Other"]=[])).push(p));
 const rosterHtml=Object.entries(groups).map(([pos,ps])=>`<div class="positionGroup"><div class="positionTitle">${esc(pos)}</div>${ps.map(p=>`<div class="playerRow"><button class="asset link" data-player="${p.id}">${esc(p.name)}</button></div>`).join("")}</div>`).join("");
 const tradeIds=APP.teamTrades[String(r)]||[];const tradeHtml=tradeIds.slice(0,10).map(id=>tradeCard(TR.find(x=>x.id===id))).join("");
 const drafts=(APP.teamDrafts[String(r)]||[]).sort((a,b)=>b.season-a.season||a.pickNo-b.pickNo);
 document.getElementById("detail").innerHTML=`<div class="detailTop"><button class="back" id="backBtn">‹ Back</button><div class="detailTitle">${esc(t.manager)}</div></div><div class="hero"><div class="heroLabel">Franchise</div><div class="heroTeams">${esc(t.teamName||t.manager)}</div><div class="heroDate">Roster ${t.rosterId}</div></div><div class="sectionTitle">Current Roster</div>${rosterHtml}<div class="sectionTitle">Current Picks</div><div class="card">${t.picks.map(assetButton).join("")||'<div class="tradeSide muted">No future picks listed.</div>'}</div><div class="sectionTitle">Recent Trades</div>${tradeHtml||'<div class="empty">No trades.</div>'}<div class="sectionTitle">Draft History</div><div class="card">${drafts.map(d=>`<div class="playerRow"><b>${d.season} ${d.round}.${String(d.slot).padStart(2,"0")}</b> — <button class="asset link" style="display:inline;width:auto" data-player="${d.playerId}">${esc(d.player)}</button></div>`).join("")}</div>`;
 showView("detail");document.getElementById("backBtn").onclick=()=>{renderTeams();showView("teams")};bindAssetLinks(document.getElementById("detail"));
}

function openTrade(id){
 closeModal();
 const t=TR.find(x=>x.id===id);if(!t)return;const [a,b]=t.rosters;
 const detail=document.getElementById("detail");
 detail.innerHTML=`<div class="detailTop"><button class="back" id="backBtn">‹ Back</button><div class="detailTitle">Trade · ${date(t.time)}</div></div>
 <div class="tabs"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="tree">Tree</button></div>
 <div id="tradePane"></div>`;
 const renderSummary=()=>{document.getElementById("tradePane").innerHTML=`<span class="originalBadge">Original Trade</span>${tradeCard(t)}<div class="muted">This section shows only the assets recorded in this transaction. Tap any player or draft pick to see its full journey.</div>`;const redundant=document.querySelector('#tradePane > .card .cardAction[data-trade="'+t.id+'"]');if(redundant)redundant.remove();bindAssetLinks(document.getElementById("tradePane"))};
 const renderTree=()=>{let parts=[];for(const r of t.rosters){const e=TS[`TRADE:${id}:R${r}`];if(e){parts.push(`<div class="sectionTitle">${esc(rosterName(r))}'s downstream tree</div><div class="treeRoot"><div class="treeBody">${(e.outputs||[]).map(s=>renderSpell(s)).join("")||'<div class="muted">No downstream assets.</div>'}</div></div>`)}}document.getElementById("tradePane").innerHTML=parts.join("")||'<div class="empty">No tree data for this trade.</div>'};
 detail.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{detail.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");b.dataset.tab==="summary"?renderSummary():renderTree()});
 renderSummary();showView("detail");
 document.getElementById("backBtn").onclick=()=>{renderTrades();showView("trades")};
}

function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.add("open");bindAssetLinks(document.getElementById("modalBody"))}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modalClose").onclick=closeModal;

function openPick(key){
 const p=PJ[key];if(!p)return openModal("Pick Journey",'<div class="empty">No journey found.</div>');
 let owner=p.originalRoster;let html=`<div class="hero"><div class="heroLabel">Pick Journey</div><div class="heroTeams">${esc(p.label)}</div></div><div class="journey">`;
 html+=`<div class="stop"><strong>${esc(rosterName(owner))}</strong><span class="muted">Original owner</span></div>`;
 for(const st of p.steps.slice(1)){
  if(st.type==="trade"){owner=st.to;html+=`<div class="stop"><strong>${esc(rosterName(st.to))}</strong><span class="muted">Acquired ${date(st.time)}</span><button class="cardAction" data-trade="${st.tradeId}">View trade ›</button></div>`}
  if(st.type==="draft"){html+=`<div class="stop"><strong>${st.round}.${String(st.slot).padStart(2,"0")} — ${esc(st.player)}</strong><span class="muted">Selected by ${esc(rosterName(st.roster))}</span><button class="asset link" data-player="${st.playerId}">${esc(st.player)} journey</button></div>`}
 }
 html+='</div>';openModal("Pick Journey",html);
}
function openPlayer(pid){
 const p=PLAYJ[String(pid)];if(!p)return openModal("Player Journey",'<div class="empty">No ownership journey found.</div>');
 let html=`<div class="hero"><div class="heroLabel">Player Journey</div><div class="heroTeams">${esc(p.label)}</div></div><div class="journey">`;
 p.spells.forEach(sp=>{html+=`<div class="stop"><strong>${esc(rosterName(sp.owner))}</strong><span class="muted">${date(sp.start)} → ${sp.end?date(sp.end):"Current"}</span>${sp.sourceType==="trade"&&sp.sourceId?`<button class="cardAction" data-trade="${esc(sp.sourceId)}">View acquiring trade ›</button>`:""}</div>`});
 html+='</div>';openModal("Player Journey",html);
}

function openSearch(){
 const players=Object.values(PLAYJ);
 openModal("Search",`<input class="searchInput" id="globalSearch" type="search" placeholder="Player, manager, pick, trade…" autofocus><div id="searchResults"></div>`);
 const inp=document.getElementById("globalSearch"),out=document.getElementById("searchResults");
 const draw=()=>{const q=inp.value.trim().toLowerCase();if(q.length<2){out.innerHTML='<div class="empty">Type at least 2 characters.</div>';return}
  let h="";
  const pm=players.filter(p=>p.label.toLowerCase().includes(q)).slice(0,8);
  if(pm.length)h+=`<div class="sectionTitle">Players</div>`+pm.map(p=>`<button class="searchResult" data-player="${p.id}"><b>${esc(p.label)}</b><span>Player journey</span></button>`).join("");
  const km=Object.values(PJ).filter(p=>p.label.toLowerCase().includes(q)).slice(0,8);
  if(km.length)h+=`<div class="sectionTitle">Draft Picks</div>`+km.map(p=>`<button class="searchResult" data-pick="${esc(p.key)}"><b>${esc(p.label)}</b><span>Pick journey</span></button>`).join("");
  const tm=Object.values(TEAMS).filter(t=>(t.manager+" "+t.teamName).toLowerCase().includes(q)).slice(0,8);
  if(tm.length)h+=`<div class="sectionTitle">Teams</div>`+tm.map(t=>`<button class="searchResult" data-team="${t.rosterId}"><b>${esc(t.manager)}</b><span>${esc(t.teamName)}</span></button>`).join("");
  const trm=TR.filter(t=>t.id.includes(q)||t.rosters.some(r=>rosterName(r).toLowerCase().includes(q))||Object.values(t.side).some(s=>[...(s.received||[]),...(s.gave||[])].some(a=>a.label.toLowerCase().includes(q)))).slice(0,8);
  if(trm.length)h+=`<div class="sectionTitle">Trades</div>`+trm.map(t=>`<button class="searchResult" data-trade="${t.id}"><b>${esc(rosterName(t.rosters[0]))} ⇄ ${esc(rosterName(t.rosters[1]))}</b><span>${date(t.time)}</span></button>`).join("");
  out.innerHTML=h||'<div class="empty">No results.</div>';bindAssetLinks(out);
 };
 inp.oninput=draw;draw();
}
document.getElementById("searchBtn").onclick=openSearch;

document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==="home")renderHome();if(v==="trades")renderTrades();if(v==="trees")renderTrees();if(v==="teams")renderTeams();showView(v)});

document.getElementById("leagueSubtitle").textContent=APP.leagueName+" · "+APP.currentSeason+" · v"+VERSION;
renderHome();

// PWA update handling
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
 window.addEventListener("load",async()=>{
  try{
   const reg=await navigator.serviceWorker.register("./service-worker.js");
   reg.addEventListener("updatefound",()=>{
    const nw=reg.installing;if(!nw)return;
    nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)document.getElementById("updateBanner").classList.add("show")});
   });
   navigator.serviceWorker.addEventListener("controllerchange",()=>window.location.reload());
  }catch(e){}
 });
}
document.getElementById("reloadBtn").onclick=async()=>{const reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.waiting)reg.waiting.postMessage({type:"SKIP_WAITING"});else location.reload()};
</script>
